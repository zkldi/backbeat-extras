name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Checks and tests
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            CARGO_PROFILE_DEV_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"

        steps:
            - name: Check out repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install native dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                    build-essential \
                    clang \
                    cmake \
                    ffmpeg \
                    file \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libsqlite3-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    lld \
                    pkg-config

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
              with:
                  toolchain: 1.96.0
                  components: clippy,rustfmt

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  env-vars: CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG

            - name: Install Rust development tools
              uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
              with:
                  tool: just,cargo-nextest

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.4.0"

            - name: Install JavaScript dependencies
              run: bun install --frozen-lockfile

            - name: Run checks
              run: just check

            - name: Run tests
              run: just test

    validate-image:
        name: Build and smoke-test CLI image
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Build CLI image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: docker/Dockerfile.backbeat-cli
                  platforms: linux/amd64
                  load: true
                  tags: backbeat-cli:ci
                  cache-from: type=gha,scope=backbeat-cli
                  cache-to: type=gha,mode=max,scope=backbeat-cli

            - name: Smoke-test CLI image
              run: docker run --rm backbeat-cli:ci -V

    publish:
        name: Publish CLI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs:
            - validate
            - validate-image
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository_owner }}/backbeat-cli
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-,format=long

            - name: Build and push image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: docker/Dockerfile.backbeat-cli
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha,scope=backbeat-cli
                  cache-to: type=gha,mode=max,scope=backbeat-cli
